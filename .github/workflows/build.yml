name: Build OrangeFox Recovery

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

  FOX_BRANCH: '12.1'
  FOX_PATH: '/home/runner/fox_12.1'

  DEVICE: 'a3core'
  VENDOR: 'samsung'

  ALLOW_MISSING_DEPENDENCIES: 'true'
  LC_ALL: 'C'
  USE_CCACHE: '1'

jobs:

  build:

    name: OrangeFox a3core

    runs-on: ubuntu-24.04

    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    steps:

      # ============================================================
      # 01 - CHECKOUT
      # ============================================================

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 02 - RUNNER DIAGNOSTICS
      # ============================================================

      - name: Runner diagnostics
        run: |
          set -eo pipefail

          echo "============================================"
          echo "RUNNER DIAGNOSTICS"
          echo "============================================"

          echo
          echo "OS:"
          cat /etc/os-release

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "CPU:"
          nproc

          lscpu | grep -E \
            'Model name|Architecture|CPU\(s\)' \
            || true

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

          echo
          echo "Workspace:"
          pwd

          echo
          echo "Git:"
          git --version

          echo
          echo "Bash:"
          bash --version | head -1

      # ============================================================
      # 03 - DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        run: |
          set -eo pipefail

          echo "============================================"
          echo "INSTALLING DEPENDENCIES"
          echo "============================================"

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libncurses6 \
            libssl-dev \
            libxml2 \
            lz4 \
            m4 \
            make \
            ninja-build \
            openjdk-11-jdk \
            openssh-client \
            pngcrush \
            python3 \
            python3-pip \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          echo
          echo "Java:"
          java -version

          echo
          echo "Python:"
          python3 --version

          echo
          echo "ccache:"
          ccache --version

      # ============================================================
      # 04 - JAVA
      # ============================================================

      - name: Configure Java
        run: |
          set -eo pipefail

          echo "============================================"
          echo "CONFIGURING JAVA"
          echo "============================================"

          JAVA_HOME_REAL="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"

          echo "JAVA_HOME=${JAVA_HOME_REAL}"

          echo "JAVA_HOME=${JAVA_HOME_REAL}" >> "$GITHUB_ENV"

          java -version

      # ============================================================
      # 05 - CCACHE
      # ============================================================

      - name: Configure ccache
        run: |
          set -eo pipefail

          echo "============================================"
          echo "CONFIGURING CCACHE"
          echo "============================================"

          mkdir -p "$HOME/.ccache"

          ccache --set-config=max_size=50G
          ccache --set-config=compression=true

          echo "CCACHE_EXEC=$(command -v ccache)" >> "$GITHUB_ENV"

          ccache -z
          ccache -s

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: orangefox-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            orangefox-ccache-${{ runner.os }}-

      # ============================================================
      # 06 - REPO
      # ============================================================

      - name: Install repo
        run: |
          set -eo pipefail

          echo "============================================"
          echo "INSTALLING REPO"
          echo "============================================"

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      # ============================================================
      # 07 - ORANGEFOX SYNC SCRIPT
      # ============================================================

      - name: Download OrangeFox sync script
        run: |
          set -eo pipefail

          echo "============================================"
          echo "ORANGEFOX SYNC SCRIPT"
          echo "============================================"

          rm -rf "$HOME/OrangeFox_sync"

          mkdir -p "$HOME/OrangeFox_sync"

          cd "$HOME/OrangeFox_sync"

          git clone \
            --depth=1 \
            https://gitlab.com/OrangeFox/sync.git

          cd sync

          chmod +x orangefox_sync.sh

          echo
          echo "Sync script:"
          ./orangefox_sync.sh --help

      # ============================================================
      # 08 - ORANGEFOX SOURCE SYNC
      # ============================================================

      - name: Sync OrangeFox source
        run: |
          set -eo pipefail

          echo "============================================"
          echo "ORANGEFOX SOURCE SYNC"
          echo "============================================"

          rm -rf "$FOX_PATH"

          cd "$HOME/OrangeFox_sync/sync"

          echo
          echo "Starting sync..."

          ./orangefox_sync.sh \
            --branch "$FOX_BRANCH" \
            --path "$FOX_PATH"

          echo
          echo "Sync command completed."

          test -d "$FOX_PATH"

          echo
          echo "Source tree:"
          ls -lah "$FOX_PATH"

      # ============================================================
      # 09 - REPO RECOVERY / VALIDATION
      # ============================================================

      - name: Validate repo tree
        run: |
          set -eo pipefail

          cd "$FOX_PATH"

          echo "============================================"
          echo "REPO TREE VALIDATION"
          echo "============================================"

          echo
          echo "Repo status:"
          repo status || true

          echo
          echo "Projects:"
          repo list \
            | head -100 \
            || true

          echo
          echo "Checking bootable/recovery..."

          if [ ! -d bootable/recovery/.git ]; then

            echo
            echo "bootable/recovery appears incomplete."

            echo
            echo "Attempting targeted recovery..."

            rm -rf bootable/recovery

            repo sync \
              --force-sync \
              --no-clone-bundle \
              --no-tags \
              -j1 \
              --fail-fast \
              bootable/recovery

          fi

          if [ ! -d bootable/recovery ]; then
            echo "ERROR: bootable/recovery still missing."
            exit 1
          fi

          echo
          echo "bootable/recovery:"
          git -C bootable/recovery status --short || true

      # ============================================================
      # 10 - DEVICE TREE
      # ============================================================

      - name: Install a3core device tree
        run: |
          set -eo pipefail

          echo "============================================"
          echo "INSTALLING A3CORE DEVICE TREE"
          echo "============================================"

          DEVICE_PATH="$FOX_PATH/device/$VENDOR/$DEVICE"

          mkdir -p "$DEVICE_PATH"

          rsync -a \
            --delete \
            --exclude='.git' \
            --exclude='.github' \
            ./ \
            "$DEVICE_PATH/"

          echo
          echo "Device path:"
          echo "$DEVICE_PATH"

          echo
          echo "Device files:"
          find "$DEVICE_PATH" \
            -maxdepth 2 \
            -type f \
            | sort

      # ============================================================
      # 11 - DEVICE TREE VALIDATION
      # ============================================================

      - name: Validate a3core device tree
        run: |
          set -eo pipefail

          DEVICE_PATH="$FOX_PATH/device/$VENDOR/$DEVICE"

          echo "============================================"
          echo "A3CORE DEVICE TREE VALIDATION"
          echo "============================================"

          REQUIRED_FILES=(
            Android.mk
            AndroidProducts.mk
            BoardConfig.mk
            device.mk
            partitions.mk
            recovery_flags.mk
          )

          for file in "${REQUIRED_FILES[@]}"; do

            if [ ! -f "$DEVICE_PATH/$file" ]; then

              echo
              echo "ERROR:"
              echo "Missing $file"

              exit 1
            fi

            echo "OK: $file"

          done

          echo
          echo "===== AndroidProducts.mk ====="

          cat "$DEVICE_PATH/AndroidProducts.mk"

          echo
          echo "===== BoardConfig.mk ====="

          sed -n '1,350p' \
            "$DEVICE_PATH/BoardConfig.mk"

          echo
          echo "===== device.mk ====="

          sed -n '1,350p' \
            "$DEVICE_PATH/device.mk"

          echo
          echo "===== Product files ====="

          find "$DEVICE_PATH" \
            -maxdepth 1 \
            -type f \
            -name '*.mk' \
            -print \
            | sort

      # ============================================================
      # 12 - SOURCE TREE VALIDATION
      # ============================================================

      - name: Validate OrangeFox source tree
        run: |
          set -eo pipefail

          cd "$FOX_PATH"

          echo "============================================"
          echo "SOURCE TREE VALIDATION"
          echo "============================================"

          REQUIRED_DIRS=(
            build
            build/make
            bootable/recovery
            vendor/recovery
            vendor/twrp
            system/core
            frameworks/base
            device/samsung/a3core
          )

          for dir in "${REQUIRED_DIRS[@]}"; do

            if [ ! -d "$dir" ]; then
              echo "ERROR: Missing $dir"
              exit 1
            fi

            echo "OK: $dir"

          done

          echo
          echo "build/envsetup.sh:"

          ls -lah build/envsetup.sh

          echo
          echo "Resolved envsetup:"

          readlink -f build/envsetup.sh

          echo
          echo "TWRP envsetup:"

          if [ -f vendor/twrp/build/envsetup.sh ]; then
            ls -lah vendor/twrp/build/envsetup.sh
          else
            echo "NOT FOUND"
          fi

      # ============================================================
      # 13 - DEEP ENVSSETUP ANALYSIS
      # ============================================================

      - name: Deep scan envsetup
        run: |
          set -eo pipefail

          cd "$FOX_PATH"

          ANALYSIS="$RUNNER_TEMP/envsetup-deep"

          rm -rf "$ANALYSIS"
          mkdir -p "$ANALYSIS"

          ENVSETUP="$(readlink -f build/envsetup.sh)"

          echo "============================================"
          echo "DEEP ENVSSETUP ANALYSIS"
          echo "============================================"

          echo
          echo "build/envsetup.sh:"
          ls -lah build/envsetup.sh

          echo
          echo "Real envsetup:"
          echo "$ENVSETUP"

          echo
          echo "SHA256:"

          sha256sum build/envsetup.sh
          sha256sum "$ENVSETUP"

          # --------------------------------------------------------
          # Main envsetup
          # --------------------------------------------------------

          cp -L \
            build/envsetup.sh \
            "$ANALYSIS/build-envsetup.sh"

          cp \
            "$ENVSETUP" \
            "$ANALYSIS/real-envsetup.sh"

          # --------------------------------------------------------
          # TWRP envsetup
          # --------------------------------------------------------

          if [ -f vendor/twrp/build/envsetup.sh ]; then

            cp \
              vendor/twrp/build/envsetup.sh \
              "$ANALYSIS/twrp-envsetup.sh"

          fi

          # --------------------------------------------------------
          # orangefox_envsetup
          # --------------------------------------------------------

          grep -n \
            -A180 \
            -B50 \
            'orangefox_envsetup' \
            "$ENVSETUP" \
            > "$ANALYSIS/orangefox_envsetup.txt" \
            || true

          # --------------------------------------------------------
          # VTS condition
          # --------------------------------------------------------

          grep -n \
            -A50 \
            -B50 \
            'frameworks/base/services/core/xsd/vts/Android.mk' \
            "$ENVSETUP" \
            > "$ANALYSIS/vts-condition.txt" \
            || true

          # --------------------------------------------------------
          # TOP
          # --------------------------------------------------------

          grep -nE \
            '\bTOP\b' \
            "$ENVSETUP" \
            > "$ANALYSIS/top-references.txt" \
            || true

          # --------------------------------------------------------
          # ZSH
          # --------------------------------------------------------

          grep -nE \
            'ZSH_VERSION' \
            "$ENVSETUP" \
            > "$ANALYSIS/zsh-references.txt" \
            || true

          # --------------------------------------------------------
          # source
          # --------------------------------------------------------

          grep -nE \
            '(^|[[:space:];])(\.|source)[[:space:]]' \
            "$ENVSETUP" \
            > "$ANALYSIS/source-references.txt" \
            || true

          # --------------------------------------------------------
          # return / exit
          # --------------------------------------------------------

          grep -nE \
            '(^|[[:space:];])(return|exit)([[:space:]]|$)' \
            "$ENVSETUP" \
            > "$ANALYSIS/return-exit.txt" \
            || true

          # --------------------------------------------------------
          # set
          # --------------------------------------------------------

          grep -nE \
            '(^|[[:space:];])set[[:space:]]' \
            "$ENVSETUP" \
            > "$ANALYSIS/set-options.txt" \
            || true

          # --------------------------------------------------------
          # VTS actual file
          # --------------------------------------------------------

          VTS="$FOX_PATH/frameworks/base/services/core/xsd/vts/Android.mk"

          if [ -f "$VTS" ]; then

            {
              echo "VTS FILE EXISTS"
              echo
              ls -lah "$VTS"
              echo
              wc -c "$VTS"
              echo
              sha256sum "$VTS"
            } > "$ANALYSIS/vts-file.txt"

          else

            {
              echo "VTS FILE DOES NOT EXIST"
              echo
              echo "Expected:"
              echo "$VTS"
            } > "$ANALYSIS/vts-file.txt"

          fi

          # --------------------------------------------------------
          # xsd tree
          # --------------------------------------------------------

          find \
            "$FOX_PATH/frameworks/base/services/core/xsd" \
            -maxdepth 6 \
            -type f \
            2>/dev/null \
            | sort \
            > "$ANALYSIS/xsd-files.txt" \
            || true

          # --------------------------------------------------------
          # Environment
          # --------------------------------------------------------

          {
            echo "PWD=$(pwd)"
            echo "TOP=${TOP:-<unset>}"
            echo "ANDROID_BUILD_TOP=${ANDROID_BUILD_TOP:-<unset>}"
            echo "OUT_DIR=${OUT_DIR:-<unset>}"
            echo "SHELL=${SHELL:-<unset>}"
            echo "BASH_VERSION=${BASH_VERSION:-<unset>}"
            echo "ZSH_VERSION=${ZSH_VERSION:-<unset>}"
          } > "$ANALYSIS/environment.txt"

          echo
          echo "============================================"
          echo "ORANGEFOX ENVSETUP FUNCTION"
          echo "============================================"

          cat "$ANALYSIS/orangefox_envsetup.txt"

          echo
          echo "============================================"
          echo "VTS CONDITION"
          echo "============================================"

          cat "$ANALYSIS/vts-condition.txt"

      # ============================================================
      # 14 - UPLOAD ENVSSETUP FILES
      # ============================================================

      - name: Upload envsetup files
        uses: actions/upload-artifact@v4
        with:
          name: envsetup-source-${{ github.run_number }}
          path: |
            /home/runner/fox_12.1/build/envsetup.sh
            /home/runner/fox_12.1/make/envsetup.sh
            /home/runner/fox_12.1/vendor/twrp/build/envsetup.sh
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      # ============================================================
      # 15 - UPLOAD DEEP ANALYSIS
      # ============================================================

      - name: Upload envsetup analysis
        uses: actions/upload-artifact@v4
        with:
          name: envsetup-deep-analysis-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/envsetup-deep/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      # ============================================================
      # 16 - LOAD ENVSSETUP
      #
      # NO set -e
      # NO set -u
      # ============================================================

      - name: Load envsetup
        run: |
          set -o pipefail

          cd "$FOX_PATH"

          echo "============================================"
          echo "LOADING ENVSETUP"
          echo "============================================"

          echo
          echo "Shell:"
          bash --version | head -1

          echo
          echo "PWD:"
          pwd

          echo
          echo "Before source:"
          echo "ANDROID_BUILD_TOP=${ANDROID_BUILD_TOP:-<unset>}"
          echo "TOP=${TOP:-<unset>}"
          echo "OUT_DIR=${OUT_DIR:-<unset>}"
          echo "ZSH_VERSION=${ZSH_VERSION:-<unset>}"

          echo
          echo "Starting source..."

          # ========================================================
          # IMPORTANT
          #
          # envsetup scripts are interactive-shell setup scripts.
          # They must NOT be sourced with errexit/nounset.
          # ========================================================

          set +e
          set +u

          source build/envsetup.sh

          ENV_RC=$?

          echo
          echo "============================================"
          echo "ENVSETUP RETURN CODE"
          echo "============================================"

          echo "RC=${ENV_RC}"

          echo
          echo "After source:"
          echo "ANDROID_BUILD_TOP=${ANDROID_BUILD_TOP:-<unset>}"
          echo "TOP=${TOP:-<unset>}"
          echo "OUT_DIR=${OUT_DIR:-<unset>}"

          if [ "$ENV_RC" -ne 0 ]; then

            echo
            echo "============================================"
            echo "ENVSSETUP RETURNED NON-ZERO"
            echo "============================================"

            echo
            echo "Running isolated trace..."

            rm -f "$RUNNER_TEMP/envsetup-debug.log"

            bash -x build/envsetup.sh \
              > "$RUNNER_TEMP/envsetup-debug.log" \
              2>&1

            TRACE_RC=$?

            echo
            echo "Trace RC=${TRACE_RC}"

            echo
            echo "============================================"
            echo "LAST 400 TRACE LINES"
            echo "============================================"

            tail -400 \
              "$RUNNER_TEMP/envsetup-debug.log" \
              || true

            exit "$ENV_RC"

          fi

          # ========================================================
          # envsetup succeeded
          # ========================================================

          set -u
          set -e

          echo
          echo "============================================"
          echo "ENVSETUP SUCCESS"
          echo "============================================"

          echo "TOP=${TOP:-<unset>}"
          echo "ANDROID_BUILD_TOP=${ANDROID_BUILD_TOP:-<unset>}"
          echo "OUT_DIR=${OUT_DIR:-<unset>}"

      # ============================================================
      # 17 - UPLOAD TRACE
      # ============================================================

      - name: Upload envsetup trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: envsetup-trace-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/envsetup-debug.log
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 18 - DETECT LUNCH
      # ============================================================

      - name: Detect a3core lunch targets
        run: |
          set -eo pipefail

          cd "$FOX_PATH"

          echo "============================================"
          echo "LUNCH TARGET DETECTION"
          echo "============================================"

          set +e
          set +u

          source build/envsetup.sh

          RC=$?

          set +u
          set -e

          if [ "$RC" -ne 0 ]; then
            echo "envsetup failed: $RC"
            exit "$RC"
          fi

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"

          echo
          echo "AndroidProducts.mk:"
          cat device/samsung/a3core/AndroidProducts.mk

          echo
          echo "Searching a3core targets..."

          lunch 2>&1 \
            | grep -i \
              a3core \
            | head -200 \
            || true

          echo
          echo "COMMON_LUNCH_CHOICES:"

          grep -R \
            -n \
            'COMMON_LUNCH_CHOICES' \
            device/samsung/a3core \
            2>/dev/null \
            || true

      # ============================================================
      # 19 - SELECT LUNCH
      # ============================================================

      - name: Select lunch target
        run: |
          set -eo pipefail

          cd "$FOX_PATH"

          echo "============================================"
          echo "SELECTING LUNCH TARGET"
          echo "============================================"

          set +e
          set +u

          source build/envsetup.sh

          RC=$?

          set +u
          set -e

          if [ "$RC" -ne 0 ]; then
            exit "$RC"
          fi

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"

          SUCCESS=0

          FALLBACKS=(
            "ofox_a3core-eng"
            "twrp_a3core-eng"
            "omni_a3core-eng"
            "fox_a3core-eng"
          )

          for TARGET in "${FALLBACKS[@]}"; do

            echo
            echo "Trying lunch:"
            echo "$TARGET"

            if lunch "$TARGET"; then

              echo
              echo "============================================"
              echo "LUNCH SUCCESS"
              echo "============================================"

              echo "TARGET_PRODUCT=${TARGET_PRODUCT}"
              echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT}"

              echo "TARGET_PRODUCT=${TARGET_PRODUCT}" \
                >> "$GITHUB_ENV"

              echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT}" \
                >> "$GITHUB_ENV"

              SUCCESS=1

              break

            fi

          done

          if [ "$SUCCESS" -ne 1 ]; then

            echo
            echo "============================================"
            echo "LUNCH FAILED"
            echo "============================================"

            echo
            echo "Available targets:"

            lunch 2>&1 \
              | grep -i a3core \
              | head -200 \
              || true

            echo
            echo "AndroidProducts.mk:"

            cat device/samsung/a3core/AndroidProducts.mk

            exit 1
          fi

      # ============================================================
      # 20 - BUILD
      # ============================================================

      - name: Build recovery
        run: |
          set -o pipefail

          cd "$FOX_PATH"

          echo "============================================"
          echo "BUILD RECOVERY"
          echo "============================================"

          set +e
          set +u

          source build/envsetup.sh

          RC=$?

          set +u
          set -e

          if [ "$RC" -ne 0 ]; then
            echo "envsetup failed: $RC"
            exit "$RC"
          fi

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"

          echo
          echo "TOP=${TOP:-<unset>}"
          echo "TARGET_PRODUCT=${TARGET_PRODUCT:-<unset>}"
          echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT:-<unset>}"
          echo "OUT_DIR=${OUT_DIR:-<unset>}"

          echo
          echo "ccache:"
          ccache -s

          echo
          echo "Starting mka recoveryimage..."

          rm -f "$RUNNER_TEMP/orangefox-build.log"

          set +e

          mka \
            -j"$(nproc)" \
            recoveryimage \
            2>&1 \
            | tee "$RUNNER_TEMP/orangefox-build.log"

          BUILD_RC=${PIPESTATUS[0]}

          set -e

          echo
          echo "BUILD_RC=${BUILD_RC}"

          if [ "$BUILD_RC" -ne 0 ]; then

            echo
            echo "============================================"
            echo "BUILD FAILED"
            echo "============================================"

            tail -500 \
              "$RUNNER_TEMP/orangefox-build.log" \
              || true

            exit "$BUILD_RC"
          fi

          echo
          echo "BUILD SUCCESSFUL"

      # ============================================================
      # 21 - FIND OUTPUT
      # ============================================================

      - name: Find recovery output
        if: always()
        run: |
          set +e

          echo "============================================"
          echo "RECOVERY OUTPUT SEARCH"
          echo "============================================"

          echo
          echo "Expected output:"

          echo "$FOX_PATH/out/target/product/$DEVICE"

          if [ -d "$FOX_PATH/out" ]; then

            find "$FOX_PATH/out" \
              -type f \
              \( \
                -name 'recovery.img' \
                -o -name 'recovery*.img' \
                -o -name '*.zip' \
                -o -name '*.tar' \
              \) \
              -print \
              | sort

          else

            echo "out/ does not exist."

          fi

      # ============================================================
      # 22 - PACKAGE
      # ============================================================

      - name: Package recovery
        run: |
          set -eo pipefail

          OUT_DIR="$FOX_PATH/out/target/product/$DEVICE"

          echo "============================================"
          echo "PACKAGE RECOVERY"
          echo "============================================"

          if [ ! -d "$OUT_DIR" ]; then

            echo "ERROR: Output directory does not exist:"
            echo "$OUT_DIR"

            exit 1
          fi

          cd "$OUT_DIR"

          if compgen -G "*.zip" > /dev/null; then

            echo
            echo "Existing ZIP:"
            ls -lh *.zip

          elif [ -f recovery.img ]; then

            echo
            echo "Creating OrangeFox ZIP..."

            zip -9 \
              "OrangeFox-${DEVICE}.zip" \
              recovery.img

          else

            echo
            echo "ERROR: No recovery.img found."

            ls -lah

            exit 1

          fi

      # ============================================================
      # 23 - VALIDATE RECOVERY
      # ============================================================

      - name: Validate recovery artifact
        run: |
          set -eo pipefail

          OUT_DIR="$FOX_PATH/out/target/product/$DEVICE"

          echo "============================================"
          echo "RECOVERY VALIDATION"
          echo "============================================"

          cd "$OUT_DIR"

          echo
          echo "Output files:"
          ls -lah

          echo
          echo "ZIP files:"

          for ZIP in *.zip; do

            [ -f "$ZIP" ] || continue

            echo
            echo "Testing $ZIP"

            unzip -t "$ZIP"

            sha256sum "$ZIP"

          done

          if [ -f recovery.img ]; then

            echo
            echo "Recovery image:"

            ls -lh recovery.img

            file recovery.img || true

            sha256sum recovery.img

          fi

      # ============================================================
      # 24 - UPLOAD BUILD LOG
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-build-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/orangefox-build.log
            ${{ runner.temp }}/envsetup-debug.log
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 25 - UPLOAD RECOVERY
      # ============================================================

      - name: Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-a3core-${{ github.run_number }}
          path: |
            /home/runner/fox_12.1/out/target/product/a3core/*.zip
            /home/runner/fox_12.1/out/target/product/a3core/recovery.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ============================================================
      # 26 - FINAL CCACHE
      # ============================================================

      - name: Final ccache statistics
        if: always()
        run: |
          echo "============================================"
          echo "CCACHE FINAL"
          echo "============================================"

          ccache -s || true

      # ============================================================
      # 27 - RELEASE METADATA
      # ============================================================

      - name: Generate release metadata
        id: meta
        run: |
          set -eo pipefail

          FOX_VERSION="R11.2"
          DATE_STR="$(date -u '+%Y%m%d-%H%M')"

          TAG_NAME="OrangeFox-${DEVICE}-${FOX_VERSION}-${DATE_STR}"

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          {
            echo "changelog<<EOF"

            git log \
              -n 20 \
              --pretty=format:'- %h %s (%an)'

            echo
            echo
            echo "Device: ${DEVICE}"
            echo "OrangeFox branch: ${FOX_BRANCH}"
            echo "Workflow run: ${GITHUB_RUN_NUMBER}"

            echo "EOF"

          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # 28 - RELEASE
      # ============================================================

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.tag_name }}
          body: |
            # OrangeFox Recovery

            Device: Samsung Galaxy A3 Core (`a3core`)

            OrangeFox branch: `${{ env.FOX_BRANCH }}`

            Workflow: `${{ github.run_number }}`

            ## Changelog

            ${{ steps.meta.outputs.changelog }}

          files: |
            /home/runner/fox_12.1/out/target/product/a3core/*.zip
            /home/runner/fox_12.1/out/target/product/a3core/recovery.img

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
