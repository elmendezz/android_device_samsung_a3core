# Version: 3
# ChangeLog:
# - Se corrigió el error de paquetes obsoletos de ncurses (libncurses5/lib32ncurses5-dev) actualizando a libncurses-dev y lib32ncurses-dev / libncurses6.
# - Se añadió el trigger por 'push' para que se ejecute automáticamente ante cualquier cambio en el repositorio.
# - Se automatizó la creación de tags y releases dinámicas con el formato 'OrangeFox-<Version>-<Fecha,Hora,Minuto>'.
# - Se configuró la extracción del historial de commits para usarlo automáticamente como descripción (changelog) del release.
# - Se corrigió el fallo de 'ccache: command not found' instalando ccache mediante apt-get en el paso de preparación del entorno.
# - Se corrigió el error 'UpdateManifestError' al hacer repo init actualizando la URL del manifest al nuevo repositorio oficial 'https://gitlab.com/OrangeFox/sync.git'.

name: Build OrangeFox Recovery

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libncurses-dev libncurses6 lib32ncurses-dev lib32ncurses6 || true

      - name: Set up repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure ccache
        run: |
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 50G

      - name: Initialize repo
        run: |
          repo init --depth=1 -u https://gitlab.com/OrangeFox/sync.git -b master

      - name: Create local manifest
        run: |
          mkdir -p .repo/local_manifests

      - name: Sync sources
        run: |
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc)

      - name: Build recovery
        run: |
          echo "Ejecutando compilación..."

      - name: Generate Release Metadata
        id: meta
        run: |
          FOX_VER="R11.1"
          DATE_STR=$(date -u +"%Y%m%d-%H%M")
          TAG_NAME="OrangeFox-${FOX_VER}-${DATE_STR}"
          
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ]; then
            CHANGELOG=$(git log ${{ github.event.before }}..${{ github.event.after }} --oneline)
          else
            CHANGELOG=$(git log -n 5 --oneline)
          fi
          
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(git log -1 --oneline)
          fi
          
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Rename Artifact
        run: |
          echo "Renombrando artefactos..."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.tag_name }}
          path: out/target/product/*/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: Release ${{ steps.meta.outputs.tag_name }}
          body: ${{ steps.meta.outputs.changelog }}
          files: out/target/product/*/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
