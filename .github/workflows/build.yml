name: Build OrangeFox Recovery

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
  FOX_BRANCH: '12.1'
  FOX_PATH: /home/runner/fox_12.1
  DEVICE: a3core
  VENDOR: samsung

jobs:
  build:
    name: Build OrangeFox a3core
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CHECKOUT DEVICE TREE
      # ============================================================

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. RUNNER DIAGNOSTICS
      # ============================================================

      - name: Runner diagnostics
        shell: bash
        run: |
          set -eo pipefail

          echo "============================================"
          echo "RUNNER INFORMATION"
          echo "============================================"

          echo
          echo "OS:"
          cat /etc/os-release

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "CPU:"
          nproc
          lscpu | grep -E 'Model name|CPU\(s\)' || true

          echo
          echo "RAM:"
          free -h

          echo
          echo "DISK:"
          df -h

          echo
          echo "Workspace:"
          pwd

          echo
          echo "Device tree:"
          find . -maxdepth 2 -type f | sort

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -eo pipefail

          echo "============================================"
          echo "INSTALLING BUILD DEPENDENCIES"
          echo "============================================"

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libncurses6 \
            libssl-dev \
            libxml2 \
            lz4 \
            m4 \
            make \
            ninja-build \
            openjdk-11-jdk \
            openssh-client \
            pngcrush \
            python3 \
            python3-pip \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          echo
          echo "Java:"
          java -version

          echo
          echo "Python:"
          python3 --version

          echo
          echo "Git:"
          git --version

          echo
          echo "ccache:"
          ccache --version

      # ============================================================
      # 4. CCACHE
      # ============================================================

      - name: Configure ccache
        shell: bash
        run: |
          set -eo pipefail

          echo "============================================"
          echo "CONFIGURING CCACHE"
          echo "============================================"

          mkdir -p "$HOME/.ccache"

          ccache --set-config=max_size=50G
          ccache --set-config=compression=true

          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_EXEC=$(command -v ccache)" >> "$GITHUB_ENV"

          ccache -z
          ccache -s

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: orangefox-ccache-${{ runner.os }}-${{ hashFiles('**/BoardConfig.mk', '**/AndroidProducts.mk') }}
          restore-keys: |
            orangefox-ccache-${{ runner.os }}-

      # ============================================================
      # 5. REPO
      # ============================================================

      - name: Install repo tool
        shell: bash
        run: |
          set -eo pipefail

          echo "============================================"
          echo "INSTALLING REPO"
          echo "============================================"

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      # ============================================================
      # 6. ORANGEFOX SYNC
      # ============================================================

      - name: Sync OrangeFox sources
        shell: bash
        run: |
          set -eo pipefail

          echo "============================================"
          echo "ORANGEFOX SOURCE SYNC"
          echo "============================================"

          rm -rf "$HOME/OrangeFox_sync"
          rm -rf "$FOX_PATH"

          mkdir -p "$HOME/OrangeFox_sync"

          cd "$HOME/OrangeFox_sync"

          git clone \
            --depth=1 \
            https://gitlab.com/OrangeFox/sync.git

          cd sync

          chmod +x orangefox_sync.sh

          echo
          echo "OrangeFox sync script:"
          ./orangefox_sync.sh --help

          echo
          echo "Starting OrangeFox ${FOX_BRANCH} sync..."

          ./orangefox_sync.sh \
            --branch "${FOX_BRANCH}" \
            --path "${FOX_PATH}"

          echo
          echo "============================================"
          echo "ORANGEFOX SYNC FINISHED"
          echo "============================================"

          test -d "${FOX_PATH}"
          test -d "${FOX_PATH}/build"

          echo
          echo "Fox tree:"
          ls -lah "${FOX_PATH}"

          echo
          echo "envsetup:"
          ls -lh "${FOX_PATH}/build/envsetup.sh"

          echo
          echo "Repo status:"
          cd "${FOX_PATH}"
          repo status || true

      # ============================================================
      # 7. INSTALL DEVICE TREE
      # ============================================================

      - name: Install a3core device tree
        shell: bash
        run: |
          set -eo pipefail

          echo "============================================"
          echo "INSTALLING A3CORE DEVICE TREE"
          echo "============================================"

          DEVICE_PATH="${FOX_PATH}/device/${VENDOR}/${DEVICE}"

          mkdir -p "${DEVICE_PATH}"

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            ./ \
            "${DEVICE_PATH}/"

          echo
          echo "Device tree installed at:"
          echo "${DEVICE_PATH}"

          echo
          echo "Files:"
          find "${DEVICE_PATH}" -maxdepth 2 -type f | sort

          echo
          echo "Required files:"

          REQUIRED_FILES=(
            "Android.mk"
            "AndroidProducts.mk"
            "BoardConfig.mk"
            "device.mk"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "${DEVICE_PATH}/${file}" ]; then
              echo "ERROR: Missing ${file}"
              exit 1
            fi

            echo "OK: ${file}"
          done

      # ============================================================
      # 8. ANALYZE DEVICE TREE
      # ============================================================

      - name: Analyze device tree
        shell: bash
        run: |
          set -eo pipefail

          DEVICE_PATH="${FOX_PATH}/device/${VENDOR}/${DEVICE}"

          echo "============================================"
          echo "DEVICE TREE ANALYSIS"
          echo "============================================"

          echo
          echo "===== AndroidProducts.mk ====="
          cat "${DEVICE_PATH}/AndroidProducts.mk"

          echo
          echo "===== BoardConfig.mk ====="
          sed -n '1,300p' "${DEVICE_PATH}/BoardConfig.mk"

          echo
          echo "===== device.mk ====="
          sed -n '1,300p' "${DEVICE_PATH}/device.mk"

          echo
          echo "===== Product makefiles ====="

          find "${DEVICE_PATH}" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*a3core*.mk' \
              -o -name 'AndroidProducts.mk' \
            \) \
            -print \
            | sort

          echo
          echo "===== twrp.dependencies ====="

          if [ -f "${DEVICE_PATH}/twrp.dependencies" ]; then
            cat "${DEVICE_PATH}/twrp.dependencies"
          else
            echo "No twrp.dependencies"
          fi

      # ============================================================
      # 9. VALIDATE SOURCE TREE
      # ============================================================

      - name: Validate source tree
        shell: bash
        run: |
          set -eo pipefail

          cd "${FOX_PATH}"

          echo "============================================"
          echo "SOURCE TREE VALIDATION"
          echo "============================================"

          REQUIRED_DIRS=(
            "build"
            "bootable/recovery"
            "vendor/recovery"
            "system/core"
            "device/samsung/a3core"
          )

          for dir in "${REQUIRED_DIRS[@]}"; do

            if [ ! -d "${dir}" ]; then
              echo "ERROR: Missing directory:"
              echo "${dir}"
              exit 1
            fi

            echo "OK: ${dir}"

          done

          echo
          echo "envsetup:"
          test -f build/envsetup.sh

          ls -lh build/envsetup.sh

          echo
          echo "Real envsetup target:"
          readlink -f build/envsetup.sh

          echo
          echo "Recovery repository:"
          git -C bootable/recovery status --short || true

          echo
          echo "Vendor recovery repository:"
          git -C vendor/recovery status --short || true

      # ============================================================
      # 10. SCAN ENVSSETUP.SH
      #
      # IMPORTANT:
      # Aquí NO ejecutamos nada todavía.
      # Primero subimos y analizamos el script.
      # ============================================================

      - name: Scan envsetup.sh
        shell: bash
        run: |
          set -eo pipefail

          cd "${FOX_PATH}"

          echo "============================================"
          echo "ENVSETUP.SH ANALYSIS"
          echo "============================================"

          ENVSETUP="build/envsetup.sh"
          REAL_ENVSETUP="$(readlink -f "${ENVSETUP}")"

          echo
          echo "Symlink:"
          ls -lah "${ENVSETUP}"

          echo
          echo "Real file:"
          echo "${REAL_ENVSETUP}"

          echo
          echo "File information:"
          file "${REAL_ENVSETUP}"

          echo
          echo "Permissions:"
          stat "${REAL_ENVSETUP}"

          echo
          echo "Line count:"
          wc -l "${REAL_ENVSETUP}"

          echo
          echo "SHA256:"
          sha256sum "${ENVSETUP}"
          sha256sum "${REAL_ENVSETUP}"

          echo
          echo "First 100 lines:"
          sed -n '1,100p' "${REAL_ENVSETUP}"

          echo
          echo "Relevant function definitions:"
          grep -nE \
            '^[[:space:]]*(function[[:space:]]+)?[A-Za-z_][A-Za-z0-9_]*[[:space:]]*\(\)' \
            "${REAL_ENVSETUP}" \
            | head -200 \
            || true

          echo
          echo "References to TOP:"
          grep -nE '\bTOP\b' "${REAL_ENVSETUP}" \
            | head -100 \
            || true

          echo
          echo "References to ZSH_VERSION:"
          grep -nE 'ZSH_VERSION' "${REAL_ENVSETUP}" \
            | head -100 \
            || true

          echo
          echo "Commands that explicitly exit:"
          grep -nE '(^|[;&[:space:]])exit[[:space:]]+[0-9]+' \
            "${REAL_ENVSETUP}" \
            | head -200 \
            || true

          echo
          echo "set options:"
          grep -nE '(^|[[:space:];])set[[:space:]]' \
            "${REAL_ENVSETUP}" \
            | head -200 \
            || true

          echo
          echo "Sourcing operations:"
          grep -nE '(^|[[:space:];])(source|\.)[[:space:]]' \
            "${REAL_ENVSETUP}" \
            | head -200 \
            || true

      # ============================================================
      # 11. UPLOAD ENVSSETUP ARTIFACT
      # ============================================================

      - name: Upload envsetup source
        uses: actions/upload-artifact@v4
        with:
          name: envsetup-source-${{ github.run_number }}
          path: |
            /home/runner/fox_12.1/build/envsetup.sh
            /home/runner/fox_12.1/make/envsetup.sh
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ============================================================
      # 12. CREATE ENVSSETUP DIAGNOSTIC PACKAGE
      # ============================================================

      - name: Create envsetup diagnostic package
        shell: bash
        run: |
          set -eo pipefail

          cd "${FOX_PATH}"

          mkdir -p "${RUNNER_TEMP}/envsetup-analysis"

          ENVSETUP="build/envsetup.sh"
          REAL_ENVSETUP="$(readlink -f "${ENVSETUP}")"

          cp -L \
            "${ENVSETUP}" \
            "${RUNNER_TEMP}/envsetup-analysis/envsetup.sh"

          cp \
            "${REAL_ENVSETUP}" \
            "${RUNNER_TEMP}/envsetup-analysis/envsetup-real.sh"

          {
            echo "ENVSETUP: ${ENVSETUP}"
            echo "REAL_ENVSETUP: ${REAL_ENVSETUP}"
            echo
            echo "SHA256:"
            sha256sum "${ENVSETUP}"
            sha256sum "${REAL_ENVSETUP}"
            echo
            echo "Bash:"
            bash --version
            echo
            echo "Shell:"
            echo "${SHELL:-<unset>}"
            echo
            echo "PWD:"
            pwd
            echo
            echo "TOP:"
            printf '%s\n' "${TOP:-<unset>}"
            echo
            echo "ANDROID_BUILD_TOP:"
            printf '%s\n' "${ANDROID_BUILD_TOP:-<unset>}"
          } > "${RUNNER_TEMP}/envsetup-analysis/environment.txt"

          grep -nE \
            'TOP|ZSH_VERSION|set -|exit |return |source |^[.] ' \
            "${REAL_ENVSETUP}" \
            > "${RUNNER_TEMP}/envsetup-analysis/relevant-lines.txt" \
            || true

          tar -czf \
            "${RUNNER_TEMP}/envsetup-analysis.tar.gz" \
            -C "${RUNNER_TEMP}" \
            envsetup-analysis

      - name: Upload envsetup diagnostic package
        uses: actions/upload-artifact@v4
        with:
          name: envsetup-diagnostic-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/envsetup-analysis.tar.gz
            ${{ runner.temp }}/envsetup-analysis/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ============================================================
      # 13. LOAD ENVSSETUP
      #
      # IMPORTANT:
      # -e OFF
      # -u OFF
      #
      # Esto permite capturar el error REAL.
      # ============================================================

      - name: Load Android build environment
        shell: bash
        run: |
          set -o pipefail

          cd "${FOX_PATH}"

          echo "============================================"
          echo "LOADING ENVSETUP"
          echo "============================================"

          echo
          echo "Shell:"
          bash --version | head -1

          echo
          echo "Before source:"
          echo "PWD=$(pwd)"
          echo "ANDROID_BUILD_TOP=${ANDROID_BUILD_TOP:-<unset>}"
          echo "TOP=${TOP:-<unset>}"
          echo "ZSH_VERSION=${ZSH_VERSION:-<unset>}"

          echo
          echo "Loading OrangeFox envsetup..."

          # ========================================================
          # ABSOLUTAMENTE IMPORTANTE:
          #
          # envsetup.sh NO se ejecuta bajo:
          #
          #   set -e
          #   set -u
          #
          # ========================================================

          set +e
          set +u

          source build/envsetup.sh

          ENV_RC=$?

          set +u

          echo
          echo "envsetup exit code: ${ENV_RC}"

          if [ "${ENV_RC}" -ne 0 ]; then

            echo
            echo "============================================"
            echo "ENVSETUP FAILED"
            echo "============================================"

            echo
            echo "Running bash trace..."

            set +e
            set +u

            bash -x build/envsetup.sh \
              2>&1 \
              | tee "${RUNNER_TEMP}/envsetup-debug.log"

            DEBUG_RC=${PIPESTATUS[0]}

            echo
            echo "Diagnostic exit code: ${DEBUG_RC}"

            echo
            echo "Last 300 lines:"
            tail -300 "${RUNNER_TEMP}/envsetup-debug.log"

            exit "${ENV_RC}"
          fi

          # ========================================================
          # Re-enable strict mode ONLY after envsetup has loaded.
          # ========================================================

          set -e
          set -u

          echo
          echo "============================================"
          echo "ENVSETUP LOADED SUCCESSFULLY"
          echo "============================================"

          echo
          echo "ANDROID_BUILD_TOP=${ANDROID_BUILD_TOP:-<unset>}"
          echo "TOP=${TOP:-<unset>}"
          echo "OUT_DIR=${OUT_DIR:-<unset>}"

      # ============================================================
      # 14. UPLOAD ENVSSETUP TRACE
      # ============================================================

      - name: Upload envsetup trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: envsetup-trace-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/envsetup-debug.log
          if-no-files-found: ignore
          retention-days: 30

      # ============================================================
      # 15. DETECT LUNCH TARGETS
      # ============================================================

      - name: Detect lunch targets
        shell: bash
        run: |
          set -eo pipefail

          cd "${FOX_PATH}"

          echo "============================================"
          echo "DETECTING LUNCH TARGETS"
          echo "============================================"

          set +e
          set +u
          source build/envsetup.sh
          ENV_RC=$?
          set -u
          set -e

          if [ "${ENV_RC}" -ne 0 ]; then
            echo "envsetup failed again with ${ENV_RC}"
            exit "${ENV_RC}"
          fi

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"

          echo
          echo "AndroidProducts.mk:"
          cat device/samsung/a3core/AndroidProducts.mk

          echo
          echo "COMMON_LUNCH_CHOICES:"

          grep -R \
            -h \
            -E 'COMMON_LUNCH_CHOICES' \
            device/samsung/a3core \
            2>/dev/null \
            || true

          echo
          echo "Available a3core lunch targets:"

          lunch 2>&1 \
            | grep -i a3core \
            | head -200 \
            || true

      # ============================================================
      # 16. SELECT LUNCH
      # ============================================================

      - name: Select lunch target
        shell: bash
        run: |
          set -eo pipefail

          cd "${FOX_PATH}"

          echo "============================================"
          echo "SELECTING LUNCH TARGET"
          echo "============================================"

          set +e
          set +u
          source build/envsetup.sh
          ENV_RC=$?
          set -u
          set -e

          if [ "${ENV_RC}" -ne 0 ]; then
            exit "${ENV_RC}"
          fi

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"

          SUCCESS=0

          TARGETS=()

          while IFS= read -r target; do

            [ -z "$target" ] && continue

            case "$target" in
              *a3core*)
                TARGETS+=("$target")
                ;;
            esac

          done < <(
            grep -R \
              -h \
              -E 'COMMON_LUNCH_CHOICES' \
              device/samsung/a3core \
              2>/dev/null \
              | grep -oE '[A-Za-z0-9_.-]*a3core[A-Za-z0-9_.-]*-[A-Za-z0-9_.-]+' \
              | sort -u
          )

          echo
          echo "Detected targets:"
          printf '  %s\n' "${TARGETS[@]}" || true

          for target in "${TARGETS[@]}"; do

            echo
            echo "Trying:"
            echo "  lunch ${target}"

            if lunch "${target}"; then

              echo
              echo "============================================"
              echo "LUNCH SUCCESS"
              echo "============================================"

              echo "TARGET_PRODUCT=${TARGET_PRODUCT}"
              echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT}"

              echo "TARGET_PRODUCT=${TARGET_PRODUCT}" >> "$GITHUB_ENV"
              echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT}" >> "$GITHUB_ENV"

              SUCCESS=1
              break

            fi

          done

          if [ "${SUCCESS}" -eq 0 ]; then

            FALLBACKS=(
              "ofox_a3core-eng"
              "twrp_a3core-eng"
              "omni_a3core-eng"
              "fox_a3core-eng"
            )

            for target in "${FALLBACKS[@]}"; do

              echo
              echo "Trying fallback:"
              echo "  lunch ${target}"

              if lunch "${target}"; then

                echo
                echo "============================================"
                echo "LUNCH SUCCESS"
                echo "============================================"

                echo "TARGET_PRODUCT=${TARGET_PRODUCT}"
                echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT}"

                echo "TARGET_PRODUCT=${TARGET_PRODUCT}" >> "$GITHUB_ENV"
                echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT}" >> "$GITHUB_ENV"

                SUCCESS=1
                break

              fi

            done

          fi

          if [ "${SUCCESS}" -ne 1 ]; then

            echo
            echo "============================================"
            echo "NO VALID LUNCH TARGET FOUND"
            echo "============================================"

            echo
            echo "AndroidProducts.mk:"
            cat device/samsung/a3core/AndroidProducts.mk

            echo
            echo "Available a3core targets:"
            lunch 2>&1 \
              | grep -i a3core \
              | head -200 \
              || true

            exit 1
          fi

      # ============================================================
      # 17. BUILD
      # ============================================================

      - name: Build recovery
        shell: bash
        run: |
          set -eo pipefail

          cd "${FOX_PATH}"

          echo "============================================"
          echo "ORANGEFOX BUILD"
          echo "============================================"

          set +e
          set +u

          source build/envsetup.sh

          ENV_RC=$?

          set +u
          set -e

          if [ "${ENV_RC}" -ne 0 ]; then
            echo "envsetup failed: ${ENV_RC}"
            exit "${ENV_RC}"
          fi

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"

          echo
          echo "TARGET_PRODUCT=${TARGET_PRODUCT}"
          echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT}"

          echo
          echo "ccache:"
          ccache -s

          echo
          echo "Disk:"
          df -h

          echo
          echo "Starting recoveryimage build..."

          BUILD_START=$(date +%s)

          set +e

          mka \
            -j"$(nproc)" \
            recoveryimage \
            2>&1 \
            | tee "${RUNNER_TEMP}/orangefox-build.log"

          BUILD_RC=${PIPESTATUS[0]}

          set -e

          BUILD_END=$(date +%s)
          BUILD_TIME=$((BUILD_END - BUILD_START))

          echo
          echo "Build exit code: ${BUILD_RC}"
          echo "Build duration: ${BUILD_TIME}s"

          if [ "${BUILD_RC}" -ne 0 ]; then

            echo
            echo "============================================"
            echo "BUILD FAILED"
            echo "============================================"

            tail -300 "${RUNNER_TEMP}/orangefox-build.log"

            exit "${BUILD_RC}"
          fi

          echo
          echo "============================================"
          echo "BUILD SUCCESSFUL"
          echo "============================================"

      # ============================================================
      # 18. FIND OUTPUT
      # ============================================================

      - name: Locate recovery output
        shell: bash
        run: |
          set -eo pipefail

          OUT_DIR="${FOX_PATH}/out/target/product/${DEVICE}"

          echo "============================================"
          echo "LOCATING BUILD OUTPUT"
          echo "============================================"

          if [ -d "${OUT_DIR}" ]; then

            echo
            echo "Output directory:"
            echo "${OUT_DIR}"

            echo
            ls -lah "${OUT_DIR}"

          else

            echo
            echo "WARNING: Expected output directory missing:"
            echo "${OUT_DIR}"

          fi

          echo
          echo "Searching recovery artifacts..."

          find "${FOX_PATH}/out" \
            -type f \
            \( \
              -name 'recovery.img' \
              -o -name 'recovery*.img' \
              -o -name '*.zip' \
            \) \
            -print \
            2>/dev/null \
            | sort

      # ============================================================
      # 19. PACKAGE
      # ============================================================

      - name: Package recovery
        shell: bash
        run: |
          set -eo pipefail

          OUT_DIR="${FOX_PATH}/out/target/product/${DEVICE}"

          echo "============================================"
          echo "PACKAGING RECOVERY"
          echo "============================================"

          if [ ! -d "${OUT_DIR}" ]; then
            echo "ERROR: Output directory missing:"
            echo "${OUT_DIR}"
            exit 1
          fi

          cd "${OUT_DIR}"

          if compgen -G "*.zip" > /dev/null; then

            echo
            echo "ZIP already exists:"
            ls -lh *.zip

          elif [ -f "recovery.img" ]; then

            echo
            echo "Creating OrangeFox ZIP..."

            zip -9 \
              "OrangeFox-${DEVICE}.zip" \
              recovery.img

          else

            echo
            echo "ERROR: No recovery.img or ZIP."

            find . -maxdepth 1 -type f -print

            exit 1
          fi

          echo
          echo "Final artifacts:"
          ls -lh *.zip

      # ============================================================
      # 20. VALIDATE ARTIFACTS
      # ============================================================

      - name: Validate artifacts
        shell: bash
        run: |
          set -eo pipefail

          OUT_DIR="${FOX_PATH}/out/target/product/${DEVICE}"

          echo "============================================"
          echo "VALIDATING ARTIFACTS"
          echo "============================================"

          ZIP_COUNT=$(
            find "${OUT_DIR}" \
              -maxdepth 1 \
              -type f \
              -name '*.zip' \
              | wc -l
          )

          if [ "${ZIP_COUNT}" -eq 0 ]; then
            echo "ERROR: No ZIP found."
            exit 1
          fi

          echo "ZIP count: ${ZIP_COUNT}"

          for zipfile in "${OUT_DIR}"/*.zip; do

            echo
            echo "Testing:"
            echo "${zipfile}"

            unzip -t "${zipfile}" >/dev/null

            echo "ZIP OK"

          done

          if [ -f "${OUT_DIR}/recovery.img" ]; then

            echo
            echo "Recovery image:"
            ls -lh "${OUT_DIR}/recovery.img"

            file "${OUT_DIR}/recovery.img" || true

            sha256sum "${OUT_DIR}/recovery.img"

          fi

      # ============================================================
      # 21. BUILD LOG
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-build-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/envsetup-debug.log
            ${{ runner.temp }}/orangefox-build.log
          if-no-files-found: ignore
          retention-days: 30

      # ============================================================
      # 22. RECOVERY ARTIFACT
      # ============================================================

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-a3core-${{ github.run_number }}
          path: |
            /home/runner/fox_12.1/out/target/product/a3core/*.zip
            /home/runner/fox_12.1/out/target/product/a3core/recovery.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ============================================================
      # 23. METADATA
      # ============================================================

      - name: Generate release metadata
        id: meta
        shell: bash
        run: |
          set -eo pipefail

          FOX_VERSION="R11.2"
          DATE_STR="$(date -u '+%Y%m%d-%H%M')"

          TAG_NAME="OrangeFox-${DEVICE}-${FOX_VERSION}-${DATE_STR}"

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          CHANGELOG="$(
            git log \
              -n 20 \
              --pretty=format:'- %h %s (%an)'
          )"

          {
            echo "changelog<<EOF"
            echo "${CHANGELOG}"
            echo
            echo "Device: ${DEVICE}"
            echo "OrangeFox branch: ${FOX_BRANCH}"
            echo "GitHub Actions run: ${GITHUB_RUN_NUMBER}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # 24. GITHUB RELEASE
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: OrangeFox ${{ env.DEVICE }} ${{ steps.meta.outputs.tag_name }}
          body: |
            # OrangeFox Recovery

            **Device:** Samsung Galaxy A3 Core (`a3core`)

            **OrangeFox branch:** `${{ env.FOX_BRANCH }}`

            **Build:** `${{ github.run_number }}`

            ## Changelog

            ${{ steps.meta.outputs.changelog }}
          files: |
            /home/runner/fox_12.1/out/target/product/a3core/*.zip
            /home/runner/fox_12.1/out/target/product/a3core/recovery.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 25. FINAL CCACHE
      # ============================================================

      - name: Final ccache statistics
        if: always()
        shell: bash
        run: |
          echo "============================================"
          echo "FINAL CCACHE STATISTICS"
          echo "============================================"

          ccache -s || true
