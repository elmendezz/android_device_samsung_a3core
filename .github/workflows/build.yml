# Version: 9
# ChangeLog:
# - Se corrigió el error de paquetes obsoletos de ncurses (libncurses5/lib32ncurses5-dev) actualizando a libncurses-dev y lib32ncurses-dev / libncurses6.
# - Se añadió el trigger por 'push' para que se ejecute automáticamente ante cualquier cambio en el repositorio.
# - Se automatizó la creación de tags y releases dinámicas con el formato 'OrangeFox-<Version>-<Fecha,Hora,Minuto>'.
# - Se configuró la extracción del historial de commits para usarlo automáticamente como descripción (changelog) del release.
# - Se corrigió el fallo de 'ccache: command not found' instalando ccache mediante apt-get en el paso de preparación del entorno.
# - Se corrigió el error 'UpdateManifestError' al hacer repo init actualizando la URL del manifest al nuevo repositorio oficial 'https://gitlab.com/OrangeFox/sync.git'.
# - Se reemplazaron los pasos de 'repo init' y 'repo sync' por el script oficial de OrangeFox (orangefox_sync.sh) clonando el repo 'sync.git' e indicando la rama 12.1 con su ruta absoluta.
# - Se configuró la variable global ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION para silenciar advertencias/bloqueos de Node 20.
# - Se añadió la bandera 'if-no-files-found: error' en upload-artifact para evitar que falle en silencio si no encuentra los .zip.
# - Se corrigió el fallo 'No such file or directory' creando la ruta 'device/samsung/a3core' mediante 'mkdir -p' antes de clonar/copiar el device tree.
# - Se corrigió la lógica del paso 'Build recovery' agregando manejo de errores estricto (set -e) y empaquetado automático a .zip en caso de que la compilación solo genere una imagen .img directa.
# - Se añadieron logs detallados y diagnósticos en cada paso crítico para evitar fallos silenciosos y mostrar la ruta exacta/estado de compilación.
# - Se cambió el shell del paso 'Build recovery' a 'bash' explícito y se añadió la verificación de existencia de 'build/envsetup.sh' antes del 'source' para evitar el crash con exit code 1.

name: Build OrangeFox Recovery

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Set up build environment
        run: |
          echo "===> Instalando paquetes requeridos..."
          sudo apt-get update
          sudo apt-get install -y ccache libncurses-dev libncurses6 lib32ncurses-dev lib32ncurses6 zip unzip || true

      - name: Set up repo
        run: |
          echo "===> Configurando repo tool..."
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure ccache
        run: |
          echo "===> Configurando ccache..."
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 50G
          ccache -s

      - name: Sync OrangeFox Sources
        run: |
          echo "===> Clonando e iniciando sync de OrangeFox..."
          mkdir -p ~/OrangeFox_sync
          cd ~/OrangeFox_sync
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path $HOME/fox_12.1
          echo "===> Contenido del directorio fox_12.1 tras sync:"
          ls -la $HOME/fox_12.1 || true

      - name: Setup Device Tree
        run: |
          echo "===> Verificando estructura antes de copiar el Device Tree..."
          if [ ! -d "$HOME/fox_12.1" ]; then
            echo "ERROR CRITICO: La carpeta $HOME/fox_12.1 no existe!"
            exit 1
          fi
          mkdir -p $HOME/fox_12.1/device/samsung/a3core
          echo "===> Copiando device tree local..."
          cp -r ./* $HOME/fox_12.1/device/samsung/a3core/ || true
          echo "===> Verificando archivos copiados:"
          ls -la $HOME/fox_12.1/device/samsung/a3core/

      - name: Build recovery
        shell: bash
        run: |
          echo "===> Entrando al entorno de compilación..."
          cd $HOME/fox_12.1 || { echo "ERROR: No existe el directorio $HOME/fox_12.1"; exit 1; }
          
          if [ ! -f "build/envsetup.sh" ]; then
            echo "ERROR CRITICO: build/envsetup.sh no se encontró dentro de $HOME/fox_12.1"
            echo "Contenido actual de $HOME/fox_12.1:"
            ls -la
            exit 1
          fi
          
          echo "===> Cargando envsetup.sh..."
          source build/envsetup.sh
          
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          
          echo "===> Ejecutando lunch..."
          lunch omni_a3core-eng || lunch fox_a3core-eng || { echo "ERROR: Falló el comando lunch"; exit 1; }
          
          echo "===> Iniciando compilación de recovery image..."
          mka recoveryimage || mka recovery || { echo "ERROR: Falló la compilación de la imagen de recovery"; exit 1; }
          
          echo "===> Verificando directorio de salida..."
          OUT_DIR="$HOME/fox_12.1/out/target/product/a3core"
          if [ -d "$OUT_DIR" ]; then
            echo "===> Archivos en $OUT_DIR:"
            ls -la "$OUT_DIR"
            cd "$OUT_DIR"
            if [ -f "recovery.img" ] && [ ! -f "*.zip" ]; then
              echo "===> Empaquetando recovery.img en zip..."
              zip -r "OrangeFox-a3core.zip" recovery.img
            fi
          else
            echo "ERROR CRITICO: No se generó la carpeta $OUT_DIR"
            exit 1
          fi

      - name: Generate Release Metadata
        id: meta
        run: |
          echo "===> Generando metadata del Release..."
          FOX_VER="R11.1"
          DATE_STR=$(date -u +"%Y%m%d-%H%M")
          TAG_NAME="OrangeFox-${FOX_VER}-${DATE_STR}"
          
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ]; then
            CHANGELOG=$(git log ${{ github.event.before }}..${{ github.event.after }} --oneline)
          else
            CHANGELOG=$(git log -n 5 --oneline)
          fi
          
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(git log -1 --oneline)
          fi
          
          echo "Tag a crear: ${TAG_NAME}"
          echo "Changelog extraído:\n${CHANGELOG}"
          
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.tag_name }}
          path: /home/runner/fox_12.1/out/target/product/*/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: Release ${{ steps.meta.outputs.tag_name }}
          body: ${{ steps.meta.outputs.changelog }}
          files: /home/runner/fox_12.1/out/target/product/*/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
